---
layout: default
---

<!-- When loaded inside the homepage popup iframe, strip the standalone
     window chrome so only the article content shows (no window-in-a-window). -->
<script>if (window.self !== window.top) document.documentElement.classList.add('in-frame');</script>

<div id="desktop-single">
  <div class="win open foc" style="top:40px;left:40px;width:calc(100vw - 80px);height:calc(100vh - 80px);z-index:100;">
    <div class="wtb" data-win="w-post">
      <div class="wtb-t">💻 {{ page.title }}</div>
      <div class="wtb-bs">
        <a href="{{ '/' | relative_url }}" class="wbtn">✕</a>
      </div>
    </div>
    <div class="wmb">
      <span>File</span>
      <span>Edit</span>
      <span>View</span>
    </div>
    <div class="wbody" style="font-size:17px; line-height:1.8;">
      <p style="color:var(--text-dim); font-size:14px; margin-bottom:20px;">
        📅 {{ page.date | date: "%B %d, %Y" }} &nbsp;|&nbsp; 
        🏷️ {{ page.categories | join: ", " | default: "uncategorized" }}
      </p>

      {{ content }}

      <div class="pixel-hr frame-hide" style="margin-top:40px;"></div>
      <p class="frame-hide" style="text-align:center; font-size:14px;">
        <a href="{{ '/' | relative_url }}#w-blog">← Back to Blog.log</a>
      </p>
    </div>
    <div class="wsb">
      <span class="sp">{{ page.title }}</span>
      <span class="sp">{{ page.date | date: "%b %d" }}</span>
    </div>
  </div>
</div>

<style>
#desktop-single {
  width:100%; height:100vh;
  background-color:#edd5e8;
  background-image:repeating-conic-gradient(#e5cce0 0% 25%, #f2dff0 0% 50%);
  background-size:20px 20px;
  position:relative;
  overflow:hidden;
}

/* ── Inside the homepage popup iframe: drop the standalone window chrome ── */
html.in-frame, html.in-frame body { background:transparent; margin:0; }
html.in-frame #desktop-single {
  width:auto; height:auto; overflow:visible;
  background:transparent; background-image:none;
}
html.in-frame #desktop-single .win {
  position:static; left:0; top:0; width:100%; height:auto;
  box-shadow:none; border:0; background:transparent;
}
html.in-frame #desktop-single .wtb,
html.in-frame #desktop-single .wmb,
html.in-frame #desktop-single .wsb { display:none; }
html.in-frame #desktop-single .wbody { height:auto; margin:0; box-shadow:none; }
html.in-frame .frame-hide { display:none; }
</style>
